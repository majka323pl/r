<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zgadnij Liczbę 💗</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #ffe6f0, #e6f7ff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    transition: 0.8s;
}

/* 💗 LOVE MODE TŁO */
body.love-mode {
    background: radial-gradient(circle at top, #ffb6d5, #ff4da6, #6b0033);
    overflow: hidden;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    z-index: 2;
}

h1 {
    color: #ff4da6;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    font-size: 16px;
}

input {
    border: 1px solid #ccc;
}

button {
    border: none;
    background: #ff4da6;
    color: white;
    cursor: pointer;
}

/* ❤️ LOVE METER */
.meter {
    width: 100%;
    height: 18px;
    background: #eee;
    border-radius: 50px;
    overflow: hidden;
    margin-top: 15px;
}

.fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff4da6, #ff1a75);
    transition: 0.3s;
}

#output {
    margin-top: 15px;
    font-size: 18px;
    min-height: 50px;
}

/* 🔥 END SCREEN */
#endScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.endBox {
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.rizz {
    font-size: 18px;
    margin: 15px 0;
}

.igBtn {
    background: #ff4da6;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    margin-top: 10px;
    border-radius: 12px;
    cursor: pointer;
}

.igCancel {
    background: #ccc;
    color: black;
}

/* 💖 SPADAJĄCE SERCA */
.heart {
    position: fixed;
    top: -20px;
    font-size: 24px;
    animation: fall linear forwards;
    z-index: 1;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1>💗 Zgadnij liczbę 1–100 💗</h1>

    <div class="meter">
        <div class="fill" id="fill"></div>
    </div>

    <input type="number" id="guess" placeholder="Twoja liczba...">
    <button onclick="check()">Strzel 💘</button>

    <div id="output"></div>

</div>

<!-- 🔥 END SCREEN -->
<div id="endScreen">
    <div class="endBox">
        <h2>TRAFIŁAŚ 💗</h2>

        <div class="rizz" id="rizzText"></div>

        <input id="igInput" placeholder="Instagram (np. @nick)">

        <button class="igBtn" onclick="confirmIG()">Potwierdź ✔️</button>
        <button class="igBtn igCancel" onclick="closeEnd()">Odrzuć ❌</button>
    </div>
</div>

<script>

let secret = Math.floor(Math.random() * 100) + 1;
let tries = 0;

const zaDuzo = [
    "ZA DUŻO 😭",
    "trochę za wysoko 😩",
    "mniej 😏"
];

const zaMalo = [
    "ZA MAŁO 😭",
    "trochę za nisko 😩",
    "więcej 😏"
];

const rizz = [
    "jakbym miał opisać Twój IG… to ‘przeznaczenie’ 😳",
    "los nas połączył 😌💗",
    "to nie gra… to matchmaking 💘",
    "zgadłaś liczbę, teraz zgadnij serce 😏",
    "twoje imię już zapisało się w mojej pamięci 💖"
];

function check() {
    let guess = Number(document.getElementById("guess").value);
    let out = document.getElementById("output");
    let fill = document.getElementById("fill");

    if (!guess || guess < 1 || guess > 100) {
        out.innerHTML = "Wpisz 1–100 😭";
        return;
    }

    tries++;

    let diff = Math.abs(secret - guess);
    let love = 100 - diff;
    if (love < 0) love = 0;

    fill.style.width = love + "%";

    if (guess === secret) {
        showEnd();
        return;
    }

    if (guess > secret) {
        out.innerHTML = zaDuzo[Math.floor(Math.random() * zaDuzo.length)] + " ⬇️";
    } else {
        out.innerHTML = zaMalo[Math.floor(Math.random() * zaMalo.length)] + " ⬆️";
    }

    document.getElementById("guess").value = "";
}

/* 💗 END GAME */
function showEnd() {
    document.body.classList.add("love-mode");
    document.getElementById("endScreen").style.display = "flex";

    document.getElementById("rizzText").innerText =
        rizz[Math.floor(Math.random() * rizz.length)];

    spawnHearts();
}

/* 💖 SERCA */
function spawnHearts() {
    for (let i = 0; i < 30; i++) {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "💖";

        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random() * 20) + "px";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }
}

/* ❌ CLOSE */
function closeEnd() {
    document.body.classList.remove("love-mode");
    document.getElementById("endScreen").style.display = "none";
}

/* ✔️ IG */
function confirmIG() {
    let ig = document.getElementById("igInput").value;

    if (!ig) {
        alert("Wpisz IG 😭");
        return;
    }

    window.open("https://instagram.com/" + ig.replace("@",""), "_blank");
}

</script>

</body>
</html>

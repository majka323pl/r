<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Fake Messenger</title>

<style>
body { font-family: Arial; display: flex; height: 100vh; margin: 0; }
.sidebar { width: 30%; background: #f0f2f5; padding: 10px; }
.chat { flex: 1; display: flex; flex-direction: column; }

.user { padding: 10px; cursor: pointer; background: white; margin-bottom: 5px; }
.user:hover { background: #ddd; }

.messages { flex: 1; padding: 10px; overflow-y: auto; }
.msg { background: #0084ff; color: white; padding: 6px 10px; margin: 5px; border-radius: 10px; width: fit-content; }

.input { display: flex; }
input { flex: 1; padding: 10px; }
button { padding: 10px; }
</style>
</head>

<body>

<div class="sidebar">
  <h3>Użytkownicy</h3>
  <div id="users"></div>
</div>

<div class="chat">
  <div class="messages" id="messages"></div>

  <div class="input">
    <input id="input" placeholder="Napisz...">
    <button onclick="send()">Wyślij</button>
  </div>
</div>

<script>
let currentUser = localStorage.getItem("me");
if (!currentUser) {
  currentUser = prompt("Podaj swój nick:");
  localStorage.setItem("me", currentUser);
}

const fakeUsers = ["Jan", "Anna", "Kuba", "Ola"];
const usersDiv = document.getElementById("users");
const messagesDiv = document.getElementById("messages");
let activeChat = null;

// render users
fakeUsers.forEach(u => {
  if (u === currentUser) return;

  const div = document.createElement("div");
  div.className = "user";
  div.innerText = u;

  div.onclick = () => {
    activeChat = getChatId(currentUser, u);
    loadMessages();
  };

  usersDiv.appendChild(div);
});

function getChatId(a, b) {
  return [a, b].sort().join("_");
}

function loadMessages() {
  messagesDiv.innerHTML = "";
  const msgs = JSON.parse(localStorage.getItem(activeChat)) || [];

  msgs.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerText = m.sender + ": " + m.text;
    messagesDiv.appendChild(div);
  });
}

function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text || !activeChat) return;

  const msgs = JSON.parse(localStorage.getItem(activeChat)) || [];

  msgs.push({
    sender: currentUser,
    text: text
  });

  localStorage.setItem(activeChat, JSON.stringify(msgs));

  input.value = "";
  loadMessages();
}
</script>

</body>
</html>

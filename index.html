<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mini Messenger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .chat {
      width: 400px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #0084ff;
      color: white;
      border-radius: 10px;
      max-width: 70%;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #0084ff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chat">
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Napisz wiadomość...">
    <button onclick="sendMessage()">Wyślij</button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("input");

  // Wczytaj zapisane wiadomości
  function loadMessages() {
    const messages = JSON.parse(localStorage.getItem("chat")) || [];
    messagesDiv.innerHTML = "";

    messages.forEach(msg => {
      const div = document.createElement("div");
      div.className = "message";
      div.textContent = msg;
      messagesDiv.appendChild(div);
    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const messages = JSON.parse(localStorage.getItem("chat")) || [];
    messages.push(text);

    localStorage.setItem("chat", JSON.stringify(messages));

    input.value = "";
    loadMessages();
  }

  // Enter = wysyłanie
  input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      sendMessage();
    }
  });

  loadMessages();
</script>

</body>
</html>
